# Copy to /mnt/user/appdata/metadachs/config.toml on Unraid.
# ${NAME} is resolved from container environment variables; missing variables fail.
[settings]
state = "/config/state"
dry_run = true
replace_existing = false
language = "de-DE"
fallback_language = "en-US"
poll_seconds = 60
stable_seconds = 30
retry_seconds = 60
cache_seconds = 86400
port = 8080
# Secrets are read from METADACHS_TMDB_TOKEN / METADACHS_PLEX_TOKEN /
# METADACHS_WEBHOOK_TOKEN. Never commit your actual configuration or secrets.

[[libraries]]
name = "Serien"
kind = "tv"
path = "${SERIES_PATH}"
sonarr_path = "${SONARR_SERIES_PATH}"
plex_path = "${PLEX_SERIES_PATH}"
plex_section = "${PLEX_SERIES_SECTION}"
# Only enable if your filenames use TMDB's season/episode ordering.
season_numbering = false

[[libraries]]
name = "Weitere Serien"
kind = "tv"
path = "${SERIES_OTHER_PATH}"
sonarr_path = "${SONARR_SERIES_OTHER_PATH}"
plex_path = "${PLEX_SERIES_OTHER_PATH}"
plex_section = "${PLEX_SERIES_OTHER_SECTION}"
season_numbering = false

[[libraries]]
name = "Filme"
kind = "movie"
path = "${MOVIES_PATH}"
plex_path = "${PLEX_MOVIES_PATH}"
plex_section = "${PLEX_MOVIES_SECTION}"